[package]
name = "aaykra-code"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Aaykra Code — a fast, native, fully agentic coding agent in pure Rust"
license = "Apache-2.0"
repository = "https://github.com/aaykra/aaykra-code"
homepage = "https://aaykra.dev"
readme = "README.md"
keywords = ["agent", "coding", "ai", "cli", "tui"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "aaykra"
path = "src/lib.rs"

[[bin]]
name = "aaykra-code"
path = "src/main.rs"

[[bin]]
name = "akc"
path = "src/bin/akc.rs"

[[bin]]
name = "aaykra-agent"
path = "src/bin/aaykra-agent.rs"

[[bin]]
name = "aaykra"
path = "src/bin/aaykra.rs"

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env", "wrap_help"] }
crossterm = "0.28"
dirs = "6"
futures-util = "0.3"
globset = "0.4"
hex = "0.4"
html2text = "0.17"
ignore = "0.4"
indexmap = { version = "2", features = ["serde"] }
mime_guess = "2"
nix = { version = "0.30", features = ["signal", "process"], default-features = false }
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
similar = "2"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tokio-test = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = 3

[profile.dev]
opt-level = 1
debug = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
# Some types like token counts can exceed 2^53 but never do in practice
cast_precision_loss = "allow"
# UI scroll offsets never exceed u16 in practice
cast_possible_truncation = "allow"
# Derived Default on enums with #[default] variant
derivable_impls = "allow"
# Too many arguments in internal functions is common for Rust async patterns
too_many_arguments = "allow"
# Assigning clones in hot paths is fine, clone_from micro-optimization not needed
assigning_clones = "allow"
# format! push_string is style preference, not a bug
format_push_string = "allow"
# Similar names for input parameter vs local variable is common in tools
similar_names = "allow"
# Long numeric literals without separators in JSON schemas
unreadable_literal = "allow"
# Cast wrap in UI scrolling is intentional
cast_possible_wrap = "allow"
# Multiple replace calls for readability
collapsible_str_replace = "allow"
# Match arms for server events are intentionally no-op
match_same_arms = "allow"
# Collapsible if in render is intentional for readability
collapsible_if = "allow"
# Useless format in render is style preference
useless_format = "allow"
# Uninlined format args is style preference
uninlined_format_args = "allow"
# Unnecessary trailing comma in format strings is style
unnecessary_trailing_comma = "allow"
# Double must_use on Result is style
double_must_use = "allow"
# Cast sign loss in UI math is intentional
cast_sign_loss = "allow"
# Needless range loop in grep is intentional for byte offsets
needless_range_loop = "allow"
# Doc markdown without backticks is style preference
doc_markdown = "allow"
# Items after statements in web tool is intentional for regex caching
items_after_statements = "allow"
# Trivially copy pass by ref in parser code is style
trivially_copy_pass_by_ref = "allow"
# map().unwrap_or() pattern is readable
map_unwrap_or = "allow"
# Single match with else is readable for action dispatch
single_match_else = "allow"
# Manual let-else in IO loops is style
manual_let_else = "allow"
# sort_by for reverse chronological is readable
unnecessary_sort_by = "allow"
# needless pass by value in sandbox selection is API style
needless_pass_by_value = "allow"
# if-not-else is readable in file write feedback
if_not_else = "allow"
# Single-char push_str is readable
single_char_add_str = "allow"
# format_collect in tests is concise
format_collect = "allow"
# fork returns Self and is used for its side effects
return_self_not_must_use = "allow"
# Case-sensitive extension comparisons are intentional for security checks
case_sensitive_file_extension_comparisons = "allow"
# Small internal parsers return Result for uniform error handling
unnecessary_wraps = "allow"
# Complex async type aliases are documented at use site
type_complexity = "allow"
# Ignored unit patterns in MCP URI fallbacks
ignored_unit_patterns = "allow"
# Context window estimates intentionally share a default
if_same_then_else = "allow"
