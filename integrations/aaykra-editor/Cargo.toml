[package]
name = "aaykra-editor-client"
version = "0.1.0"
edition = "2024"
publish = false
description = "Reference editor bridge for the Aaykra Code HTTP/SSE server"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "charset", "http2"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
